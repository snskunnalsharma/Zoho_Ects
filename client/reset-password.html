<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagle Creek Therapy Services — Reset Password</title>
    <link rel="icon" type="image/png" href="assets/ects-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="page-login">
    <div class="auth-layout">
      <section class="auth-brand" aria-label="Eagle Creek Therapy Services">
        <a href="index.html" class="auth-brand-link" title="Eagle Creek Therapy Services">
          <img
            class="auth-brand-logo"
            src="assets/ects-logo.png"
            alt="Eagle Creek Therapy Services"
          />
        </a>
        <p class="auth-brand-line">Set a new password for portal access</p>
      </section>

      <section class="auth-panel" aria-labelledby="reset-title">
        <div class="auth-panel-inner">
          <p class="auth-kicker">Password Reset</p>
          <h1 id="reset-title">Update Password</h1>
          <p class="auth-hint">
            Enter your Portal Access Email and your new desired password below.
          </p>

          <form class="auth-form" id="reset-password-form" novalidate>
            <label class="field">
              <span>Portal Access Email</span>
              <input
                type="email"
                name="portalEmail"
                id="portal-email"
                autocomplete="username"
                required
                placeholder="name@agency.com"
              />
            </label>

            <label class="field">
              <span>Current Password</span>
              <div class="password-field">
                <input
                  type="password"
                  name="currentPassword"
                  id="current-password"
                  autocomplete="current-password"
                  required
                  placeholder="Enter current password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="toggle-current-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </label>

            <label class="field">
              <span>New Password</span>
              <div class="password-field">
                <input
                  type="password"
                  name="newPassword"
                  id="new-password"
                  autocomplete="new-password"
                  required
                  placeholder="At least 6 characters"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="toggle-new-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </label>

            <label class="field">
              <span>Confirm New Password</span>
              <div class="password-field">
                <input
                  type="password"
                  name="confirmPassword"
                  id="confirm-password"
                  autocomplete="new-password"
                  required
                  placeholder="Re-enter new password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="toggle-confirm-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </label>

            <button class="btn btn-primary" type="submit" id="reset-btn">
              Update Password
            </button>
            <div class="form-row form-row-center">
              <a class="text-link" href="index.html">Back to sign in</a>
            </div>
          </form>

          <p class="success-banner" id="success-banner" hidden></p>
          <p class="error-banner" id="error-banner" hidden></p>
        </div>
      </section>
    </div>
    <script src="reset-password.js"></script>
  </body>
</html>
