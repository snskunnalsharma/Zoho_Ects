<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagle Creek Therapy Services — Agency Portal</title>
    <link rel="icon" type="image/png" href="assets/ects-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="page-login">
    <div class="auth-layout">
      <section class="auth-brand" aria-label="Eagle Creek Therapy Services">
        <a href="index.html" class="auth-brand-link" title="Eagle Creek Therapy Services">
          <img
            class="auth-brand-logo"
            src="assets/ects-logo.png"
            alt="Eagle Creek Therapy Services"
          />
        </a>
        <!-- <p class="auth-brand-line">Therapy services for partner agencies</p> -->
      </section>

      <section class="auth-panel" aria-labelledby="sign-in-title">
        <div class="auth-panel-inner">
          <p class="auth-kicker">Agency Portal</p>
          <h1 id="sign-in-title">Sign in</h1>
          <p class="auth-hint">Use your Portal Access Email and Credential.</p>

          <form class="auth-form" id="login-form" novalidate>
            <label class="field">
              <span>Portal Access Email</span>
              <input
                type="email"
                name="portalEmail"
                id="portal-email"
                autocomplete="username"
                required
                placeholder="name@agency.com"
              />
            </label>
            <label class="field">
              <span>Password</span>
              <div class="password-field">
                <input
                  type="password"
                  name="credential"
                  id="credential"
                  autocomplete="current-password"
                  required
                  placeholder="Enter Password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="toggle-credential"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </label>
            <div class="form-row">
              <a class="text-link" href="forgot-password.html">Forgot Password?</a>
            </div>
            <button class="btn btn-primary" type="submit" id="login-btn">
              Continue
            </button>
          </form>

          <p class="error-banner" id="error-banner" hidden></p>
        </div>
      </section>
    </div>
    <script src="main.js"></script>
  </body>
</html>
