<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagle Creek Therapy Services — Forgot password</title>
    <link rel="icon" type="image/png" href="assets/ects-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="page-login">
    <div class="auth-layout">
      <section class="auth-brand" aria-label="Eagle Creek Therapy Services">
        <a href="index.html" class="auth-brand-link" title="Eagle Creek Therapy Services">
          <img
            class="auth-brand-logo"
            src="assets/ects-logo.png"
            alt="Eagle Creek Therapy Services"
          />
        </a>
        <p class="auth-brand-line">We’ll help you reset portal access</p>
      </section>

      <section class="auth-panel" aria-labelledby="reset-title">
        <div class="auth-panel-inner">
          <p class="auth-kicker">Password help</p>
          <h1 id="reset-title">Forgot Password</h1>
          <p class="auth-hint">
            Enter your Portal Access Email and we’ll start a password reset for
            your account.
          </p>

          <form class="auth-form" id="forgot-form" novalidate>
            <label class="field">
              <span>Portal Access Email</span>
              <input
                type="email"
                name="portalEmail"
                id="portal-email"
                autocomplete="username"
                required
                placeholder="name@agency.com"
              />
            </label>
            <button class="btn btn-primary" type="submit" id="forgot-btn">
              Request reset
            </button>
            <div class="form-row form-row-center">
              <a class="text-link" href="reset-password.html">Set new password directly</a>
              <span style="opacity:0.4; margin:0 0.25rem;">|</span>
              <a class="text-link" href="index.html">Back to sign in</a>
            </div>
          </form>

          <p class="success-banner" id="success-banner" hidden></p>
          <p class="error-banner" id="error-banner" hidden></p>
        </div>
      </section>
    </div>
    <script src="forgot-password.js"></script>
  </body>
</html>
